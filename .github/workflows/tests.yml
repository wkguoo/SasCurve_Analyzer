name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Select tests from the changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "${BASE_SHA//0/}" != "" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python scripts/select_tests.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

  headless:
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install headless dependencies
        run: python -m pip install -r requirements-headless.txt
      - name: Verify unattended workflow without Qt
        env:
          MPLBACKEND: Agg
          SAS_TEST_PLAN: ${{ needs.plan.outputs.plan }}
        run: python scripts/select_tests.py --run --headless

  pytest:
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
          SAS_TEST_PLAN: ${{ needs.plan.outputs.plan }}
        run: python scripts/select_tests.py --run
