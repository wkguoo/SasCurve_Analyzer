name: Tests

on:
  pull_request:

jobs:
  headless:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install headless dependencies
        run: python -m pip install -r requirements-headless.txt
      - name: Verify unattended workflow without Qt
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests/test_study.py tests/test_publication_bundle.py tests/test_metric_units.py tests/test_pr_batch_config.py tests/test_cache_atomic.py tests/test_batch_inputs.py tests/test_batch_import.py tests/test_sequence_analysis.py tests/test_auto_batch.py tests/test_analysis_runner.py tests/test_saxs_input_contract.py tests/test_result_package.py

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
